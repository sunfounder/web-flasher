<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 DEV Board 测试烧录 · O3402V10</title>
<link rel="icon" type="image/png" href="../../favicon.png">
<link rel="apple-touch-icon" href="../../favicon.png">
<style>
  body{font-family:system-ui,"Microsoft YaHei",sans-serif;max-width:720px;margin:24px auto;padding:0 16px;color:#222}
  a.back{font-size:13px;color:#00a04f;text-decoration:none}
  h2{margin:8px 0 4px}
  .ver{color:#666;font-size:13px;margin:0 0 4px;line-height:1.7}
  ol{line-height:1.9;padding-left:22px;margin:10px 0 16px}
  button{font-size:20px;padding:14px 28px;border:0;border-radius:10px;cursor:pointer;background:#00a04f;color:#fff;width:100%}
  button:disabled{opacity:.5;cursor:not-allowed}
  .bar{height:14px;background:#eee;border-radius:7px;overflow:hidden;margin:14px 0 8px}
  #bar{height:100%;width:0%;background:#00a04f;transition:width .15s}
  #st{font-size:15px;min-height:24px;white-space:pre-wrap;color:#333}
  #log{background:#111;color:#0f0;font:13px/1.5 Consolas,monospace;height:420px;overflow:auto;
       padding:10px;border-radius:8px;margin-top:10px;white-space:pre-wrap;word-break:break-all;display:none}
</style>
</head>
<body>
<a class="back" href="../../">← 返回工具列表</a>
<h2>ESP32 DEV Board 测试烧录 · O3402V10</h2>
<p class="ver">请用电脑上的 <b>Chrome 或 Edge</b> 打开本页（会自动检查，不满足会弹窗）；参数已配好，不用选。</p>

<ol>
  <li>USB-C 线把板子连到电脑。</li>
  <li>点「连接并刷机」，弹窗里选 <b>CH340</b> 串口。</li>
  <li>完成后下面自动变成串口日志；板子没启动就按一下板上 <b>RST</b> 键。</li>
</ol>

<button id="go">连接并刷机</button>
<div class="bar"><div id="bar"></div></div>
<div id="st"></div>
<pre id="log"></pre>

<script type="module">
import { ESPLoader, Transport } from "../../vendor/esptool-js-bundle.js";

const $ = id => document.getElementById(id);
const st = $("st"), bar = $("bar"), logEl = $("log"), go = $("go");
const sleep = ms => new Promise(r => setTimeout(r, ms));

let FW = null;          // 只烧这一版（firmwares.json 里第一条）
let port = null;
let monitoring = false;
let reader = null;
let busy = false;

function log(line){
  logEl.style.display = "block";
  logEl.textContent += line.endsWith("\n") ? line : line + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}
function setStatus(s){ st.textContent = s; }
function setBar(p){ bar.style.width = p + "%"; }

/* ---------- 打开页面自动检查浏览器/环境 ---------- */
function checkEnvironment(){
  const ua = navigator.userAgent || "";
  const isChromium = /Chrome|Chromium|Edg\//i.test(ua) && !/EdgA|OPR|SamsungBrowser|Firefox/i.test(ua);
  const problems = [];
  if (!window.isSecureContext) problems.push("本页不是 https（或 localhost）打开");
  if (!navigator.serial) problems.push("这个浏览器不支持 Web Serial");
  if (!isChromium) problems.push("当前不是 Chrome / Edge");
  if (problems.length){
    alert("⚠️ 打不开烧录功能：\n\n- " + problems.join("\n- ")
      + "\n\n请复制本页地址，用电脑上的 Chrome 或 Edge（最新版）打开。");
    setStatus("❌ 请用电脑上的 Chrome 或 Edge 打开本页");
    go.disabled = true;
    return false;
  }
  return true;
}

/* ---------- 读固件清单（页面只有一个固件，自动选第一条） ---------- */
async function loadFirmware(){
  const resp = await fetch("./firmwares.json", { cache: "no-store" });
  if (!resp.ok) throw new Error("固件清单读取失败 HTTP " + resp.status);
  const list = (await resp.json()).firmwares || [];
  if (!list.length) throw new Error("固件清单为空");
  FW = list[0];
}

/* ---------- 串口日志（烧录完成后自动切过来） ---------- */
async function startMonitor(){
  if (!port) return;
  try {
    await port.open({ baudRate: 115200 });
  } catch (e) {
    log("[网页] 串口打开失败：" + (e && e.message ? e.message : e));
    return;
  }
  // 给板子一个复位脉冲（只拉 RTS，不动 DTR，避免把 IO0 拉低进下载模式）
  try {
    await port.setSignals({ dataTerminalReady: false, requestToSend: true });
    await sleep(150);
    await port.setSignals({ dataTerminalReady: false, requestToSend: false });
  } catch (e) { /* 某些驱动不支持 setSignals，忽略 */ }

  log("===== 串口日志（115200）=====");
  monitoring = true;
  const decoder = new TextDecoder("utf-8", { fatal: false });
  try { reader = port.readable.getReader(); } catch (e) { log("[网页] 串口读取失败"); return; }
  try {
    for (;;){
      const { value, done } = await reader.read();
      if (done || !monitoring) break;
      if (value && value.length) log(decoder.decode(value, { stream: true }));
    }
  } catch (e) { /* 拔掉 USB / 端口关闭 */ }
  finally {
    const r = reader; reader = null;
    if (r){ try { r.releaseLock(); } catch (e) {} }
    monitoring = false;
  }
}

async function stopMonitor(){
  monitoring = false;
  const r = reader; reader = null;
  if (r){ try { await r.cancel(); } catch (e) {} }
  await sleep(80);
  try { if (port && port.readable) await port.close(); } catch (e) {}
}

/* ---------- 一键：连接 → 烧录 → 自动转串口日志 ---------- */
go.addEventListener("click", async () => {
  if (busy) return;
  busy = true;
  go.disabled = true;
  setBar(0);
  setStatus("准备中…");
  try {
    if (!FW) await loadFirmware();
    if (monitoring) await stopMonitor();
    if (!port) port = await navigator.serial.requestPort();

    setStatus("① 连接设备…");
    const loader = new ESPLoader({
      transport: new Transport(port, true),
      baudrate: 115200,
      terminal: { clean(){}, writeLine: d => log(d), write: d => log(d) },
    });
    await loader.main();

    setStatus("② 读取固件…");
    const segs = [];
    for (const s of FW.segments){
      const resp = await fetch(s.file, { cache: "no-store" });
      if (!resp.ok) throw new Error("固件文件读取失败 HTTP " + resp.status);
      segs.push({ data: new Uint8Array(await resp.arrayBuffer()), address: s.address });
    }

    setStatus("③ 写入中…");
    log("===== 烧录日志 =====");
    await loader.writeFlash({
      fileArray: segs,
      flashMode: FW.flashMode || "dio",
      flashFreq: FW.flashFreq || "80m",
      flashSize: FW.flashSize || "4MB",
      eraseAll: FW.eraseAll !== false,
      compress: true,
      reportProgress: (fi, written, total) => {
        const p = Math.round(written / total * 100);
        setBar(p);
        setStatus("③ 写入中 " + p + "%");
      },
    });
    setBar(100);

    setStatus("④ 烧录完成，正在打开串口日志…");
    try { await loader.after("hard_reset"); } catch (e) { /* 部分驱动不支持 */ }
    try { await loader.transport.disconnect(); } catch (e) {}
    await sleep(300);
    await startMonitor();

    setStatus("✅ 烧录完成，以下是板子串口日志；没启动就按一下板上 RST 键");
    setBar(100);
  } catch (e) {
    setStatus("❌ " + (e && e.message ? e.message : e));
    log("[网页] " + (e && e.message ? e.message : e));
    try { if (monitoring) await stopMonitor(); } catch (e2) {}
    try { if (port && port.readable) await port.close(); } catch (e2) {}
  } finally {
    busy = false;
    go.disabled = false;
  }
});

/* ---------- 启动 ---------- */
if (checkEnvironment()){
  setStatus("先点下面的按钮；参数已配好。");
  loadFirmware().catch(e => {
    setStatus("❌ " + e.message);
    log("[网页] " + e.message);
  });
}
</script>
</body>
</html>
