<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GalaxyRVR Firmware Update</title>
<link rel="icon" type="image/png" href="../../favicon.png">
<link rel="apple-touch-icon" href="../../favicon.png">
<style>
  body{font-family:system-ui,"Microsoft YaHei",sans-serif;max-width:640px;margin:40px auto;padding:0 16px;color:#222;line-height:1.5}
  h2{margin:0 0 18px}
  h3{margin:34px 0 10px;font-size:17px}
  ol{line-height:1.6;padding-left:24px;margin:0}
  ol > li{margin-bottom:16px}
  select{display:block;font-size:16px;padding:8px;width:100%;max-width:360px;box-sizing:border-box;border:1px solid #bbb;border-radius:6px;margin-top:8px}
  button.go{display:block;font-size:17px;padding:12px 24px;border:0;border-radius:8px;cursor:pointer;background:#00a04f;color:#fff;margin-top:10px}
  button.go:disabled{opacity:.5;cursor:not-allowed}
  .bar{height:14px;background:#eee;border-radius:7px;overflow:hidden;margin:14px 0 0;max-width:420px}
  #bar{height:100%;width:0%;background:#00a04f;transition:width .15s}
  #st{font-size:14px;min-height:20px;white-space:pre-wrap;margin-top:8px}
  #log{background:#111;color:#0f0;font:12px/1.5 Consolas,monospace;height:280px;overflow:auto;padding:10px;border-radius:8px;display:none;margin-top:10px}
  .notice{display:none;color:#a11;font-size:13px;margin-top:10px}
  details{border-top:1px solid #e6e9ec;padding:10px 0}
  details summary{cursor:pointer;font-weight:600;font-size:14px}
  details p{color:#555;font-size:14px;margin:8px 0 0;line-height:1.7}
  details p b{color:#333}
  .lang-toggle{position:fixed;top:16px;right:16px;z-index:999;background:#fff;border:1px solid #e2e8f0;border-radius:6px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:#1e293b}
  .lang-toggle:hover{background:#00a04f;color:#fff;border-color:#00a04f}
</style>
</head>
<body>
<button class="lang-toggle" id="langToggle" onclick="toggleLang()">中文</button>

<h2 data-en="GalaxyRVR Firmware Update" data-zh="GalaxyRVR 固件烧录"></h2>

<ol>
  <li data-en="Power on the rover, connect the USB cable to the <b>main board</b>, and set the switch on the expansion board to <b>Upload</b>."
      data-zh="火星车通电，USB 线接<b>主板</b>，把扩展板上的拨动开关拨到 <b>Upload</b>。"></li>

  <li>
    <span data-en="Select the firmware version." data-zh="选择固件版本。"></span>
    <select id="fw"></select>
  </li>

  <li>
    <span data-en="Click <b>Connect &amp; Flash</b> and choose the port of your board." data-zh="点 <b>连接并烧录</b>，在弹出的列表里选主板对应的串口。"></span>
    <button class="go" id="go" data-en="Connect &amp; Flash" data-zh="连接并烧录"></button>
    <p class="notice" id="notice" data-en="This page needs Web Serial. Please open it in Chrome or Edge on a computer." data-zh="本页需要 Web Serial 支持，请在电脑上用 Chrome 或 Edge 打开。"></p>
    <div class="bar"><div id="bar"></div></div>
    <div id="st"></div>
    <div id="log"></div>
  </li>

  <li data-en="When it finishes, set the switch back to <b>Run</b> and power the rover on again."
      data-zh="烧完后把拨动开关拨回 <b>Run</b>，重新上电。"></li>
</ol>

<h3 data-en="FAQ" data-zh="常见问题"></h3>

<details>
  <summary data-en="Which firmware version should I choose?" data-zh="我该选哪个固件版本？"></summary>
  <p data-en="<b>1.1.0</b> is for the first generation GalaxyRVR. <b>2.0.1</b> is for the current generation. If you are not sure which rover you have, check the label on the box or contact us."
     data-zh="<b>1.1.0</b> 供第一代 GalaxyRVR 使用，<b>2.0.1</b> 供现在的版本使用。分不清自己手上是哪一代，看包装盒上的标签，或联系我们。"></p>
</details>

<details>
  <summary data-en="No port dialog appears" data-zh="没有弹出串口列表"></summary>
  <p data-en="Use <b>Chrome</b> or <b>Edge</b> on a computer, and make sure this page is opened over <b>https</b>."
     data-zh="请在电脑上使用 <b>Chrome</b> 或 <b>Edge</b>，并确认本页是通过 <b>https</b> 打开的。"></p>
</details>

<details>
  <summary data-en="Cannot connect to the board" data-zh="连接不上主板"></summary>
  <p data-en="Close other programs that are using the serial port (Arduino IDE, serial monitor, another browser tab). Check that the switch is still on <b>Upload</b>, and that the USB serial driver is installed &mdash; on Windows, Device Manager should list <b>USB-SERIAL CH340</b>."
     data-zh="关掉其他正在占用串口的程序（Arduino IDE、串口监视器、另一个浏览器标签页）。确认拨动开关仍在 <b>Upload</b>，并装好 USB 串口驱动——Windows 在设备管理器里应看到 <b>USB-SERIAL CH340</b>。"></p>
</details>

<details>
  <summary data-en="The flash failed &mdash; can I just try again?" data-zh="烧录失败了，能重试吗？"></summary>
  <p data-en="Yes. Unplug the USB cable, plug it back in, set the switch to <b>Upload</b> and run it again. Re-flashing does not damage the rover."
     data-zh="可以。拔下 USB 再插上，把开关拨到 <b>Upload</b>，重新点一次即可；重复烧录不会损坏火星车。"></p>
</details>

<script>
function getLang() {
  var params = new URLSearchParams(window.location.search);
  var urlLang = params.get("lang");
  if (urlLang === "zh" || urlLang === "en") return urlLang;
  var userLang = navigator.language || navigator.userLanguage || "en";
  return userLang.toLowerCase().startsWith("zh") ? "zh" : "en";
}
function toggleLang() {
  var url = new URL(window.location);
  url.searchParams.set("lang", getLang() === "zh" ? "en" : "zh");
  window.location.href = url.toString();
}
var LANG = getLang();
function T(en, zh) { return LANG === "zh" ? zh : en; }
</script>

<script type="module">
import { STK500 } from "../../vendor/webserial-flasher/stk500.js";
import { WebSerialTransport } from "../../vendor/webserial-flasher/transport/WebSerialTransport.js";

const st = el("st"), bar = el("bar"), logEl = el("log");
const sel = el("fw"), go = el("go"), notice = el("notice");
function el(id){ return document.getElementById(id); }
function log(s){ logEl.style.display="block"; const d=document.createElement("div"); d.textContent=s; logEl.appendChild(d); logEl.scrollTop=1e9; }
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

let BOARD = {};
let LIST = [];

async function loadList(){
  const resp = await fetch("./firmwares.json", { cache: "no-store" });
  if (!resp.ok) throw new Error("HTTP " + resp.status);
  const cfg = await resp.json();
  BOARD = cfg.board || {};
  LIST = cfg.firmwares || [];
  if (!LIST.length) throw new Error("empty firmware list");
  sel.innerHTML = "";
  for (const fw of LIST){
    const o = document.createElement("option");
    o.value = LIST.indexOf(fw);
    o.textContent = fw.version + (fw.date ? " (" + fw.date + ")" : "");
    sel.appendChild(o);
  }
}

function hexToBytes(hex){
  const s = String(hex || "").replace(/[^0-9a-fA-F]/g, "");
  const out = new Uint8Array(s.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(s.substr(i * 2, 2), 16);
  return out;
}

go.addEventListener("click", async () => {
  go.disabled = true;
  bar.style.width = "0%";
  st.textContent = "";
  logEl.innerHTML = "";
  logEl.style.display = "none";
  let transport = null;
  try {
    const fw = LIST[+sel.value];
    if (!fw) throw new Error(T("Select a firmware version first.", "请先选择固件版本。"));
    if (!navigator.serial) throw new Error(T("This page needs Web Serial. Please open it in Chrome or Edge on a computer.",
      "本页需要 Web Serial 支持，请在电脑上用 Chrome 或 Edge 打开。"));

    st.textContent = T("Reading firmware file…", "读取固件文件…");
    const resp = await fetch(fw.file, { cache: "no-store" });
    if (!resp.ok) throw new Error("HTTP " + resp.status + " " + fw.file);
    const hexText = await resp.text();
    if (hexText.indexOf(":") !== 0) throw new Error("bad firmware file: " + fw.file);

    const board = {
      name: BOARD.name || "Arduino UNO",
      baudRate: BOARD.baudRate || 115200,
      signature: hexToBytes(BOARD.signature || "1e950f"),
      pageSize: BOARD.pageSize || 128,
      timeout: 600,
      flashSize: BOARD.flashSize || 32256,
      // 复位由本页自己发：库的 setSignals 传 {dtr,rts} 与 Web Serial 规范不同名，交给它等于不复位
      resetMethod: "none",
      resetDelayMs: 0,
    };

    st.textContent = T("Choose the serial port of your board in the dialog…", "请在弹窗里选择主板对应的串口…");
    const port = await navigator.serial.requestPort();
    transport = new WebSerialTransport(port);
    st.textContent = T("Opening the port…", "打开串口…");
    await transport.open(board.baudRate);

    // Arduino 自动复位：DTR 拉低再放开，经 100nF 电容给 RESET 一个脉冲
    st.textContent = T("Resetting the board…", "复位主板…");
    try {
      await port.setSignals({ dataTerminalReady: false, requestToSend: false });
      await sleep(120);
      await port.setSignals({ dataTerminalReady: true, requestToSend: true });
    } catch (e) { log("setSignals unsupported: " + e.message); }
    await sleep(BOARD.resetDelayMs || 500);

    const stk = new STK500(transport, board, {
      logger: (level, message) => log("[" + level + "] " + message),
      retry: { syncAttempts: 10, retryDelayMs: 250 },
    });

    st.textContent = T("Connecting to the board…", "连接主板…");
    await stk.sync(10);
    await stk.sync(3);
    await stk.verifySignature();
    await stk.setOptions();
    await stk.enterProgrammingMode();
    bar.style.width = "18%";

    st.textContent = T("Writing firmware… 0%", "写入固件… 0%");
    await stk.upload(hexText, (pct) => {
      const p = Math.round(pct);
      bar.style.width = (18 + p * 0.57) + "%";
      st.textContent = T("Writing firmware… ", "写入固件… ") + p + "%";
    });

    st.textContent = T("Verifying… 0%", "回读校验… 0%");
    await stk.verify(hexText, (pct) => {
      const p = Math.round(pct);
      bar.style.width = (75 + p * 0.2) + "%";
      st.textContent = T("Verifying… ", "回读校验… ") + p + "%";
    });

    st.textContent = T("Finishing up…", "收尾…");
    await stk.exitProgrammingMode();
    await transport.close();
    transport = null;

    bar.style.width = "100%";
    st.textContent = T("✔ Done — firmware flashed.", "✔ 完成，固件已烧录。");
    alert(T(
      "Firmware flashed successfully.\n\nVersion " + fw.version + "\n\n"
        + "1. Set the switch back to Run\n2. Power the rover on again",
      "固件烧录成功。\n\n版本 " + fw.version + "\n\n"
        + "1. 把拨动开关拨回 Run\n2. 重新上电"
    ));
  } catch (e) {
    st.textContent = T("Failed: ", "失败：") + (e && e.message ? e.message : e);
    log(String(e && e.stack || e));
  } finally {
    if (transport) { try { await transport.close(); } catch (e) { /* ignore */ } }
    go.disabled = false;
  }
});

loadList().catch(e => { st.textContent = T("Failed: ", "失败：") + e.message; log(String(e && e.stack || e)); });
</script>

<script>
// 语言落地 + 打开页面就检查 Web Serial 支持情况
(function () {
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  document.title = T("GalaxyRVR Firmware Update", "GalaxyRVR 固件烧录");
  document.querySelectorAll("[data-en][data-zh]").forEach(function (el) {
    el.innerHTML = LANG === "zh" ? el.getAttribute("data-zh") : el.getAttribute("data-en");
  });
  document.getElementById("langToggle").textContent = LANG === "zh" ? "EN" : "中文";

  if (!navigator.serial) {
    var msg = T("This page needs the Web Serial API. Please open it in Chrome or Edge on a computer.",
                "本页需要 Web Serial 支持，请在电脑上用 Chrome 或 Edge 打开。");
    document.getElementById("go").disabled = true;
    document.getElementById("notice").style.display = "block";
    alert(msg);
  }
})();
</script>
</body>
</html>
