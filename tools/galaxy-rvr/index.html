<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GalaxyRVR Firmware Update</title>
<link rel="icon" type="image/png" href="../../favicon.png">
<link rel="apple-touch-icon" href="../../favicon.png">
<script>
/* 语言判定放最前面：后面按语言挑视频、换文案都要用，且必须赶在 <video> 被解析之前 */
function getLang() {
  var params = new URLSearchParams(window.location.search);
  var urlLang = params.get("lang");
  if (urlLang === "zh" || urlLang === "en") return urlLang;
  var userLang = navigator.language || navigator.userLanguage || "en";
  return userLang.toLowerCase().startsWith("zh") ? "zh" : "en";
}
window.LANG = getLang();
</script>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#f4f6f8;margin:0;padding:36px 16px 60px;color:#222;line-height:1.55}
  .wrap{max-width:700px;margin:0 auto}
  /* ---- 卡片 ---- */
  .card{background:#fff;border:1px solid #e4e8ec;border-radius:14px;box-shadow:0 2px 12px rgba(16,32,48,.06);padding:26px 26px 20px}
  h2{margin:0 0 20px;font-size:22px}
  /* ---- 步骤指示器 ---- */
  .steps{display:flex;gap:10px;margin:0 0 24px;padding:0;list-style:none}
  .steps li{flex:1;text-align:center;font-size:13px;color:#98a2ad;border-top:3px solid #e4e8ec;padding-top:9px}
  .steps li .n{display:inline-block;width:19px;height:19px;line-height:19px;border-radius:50%;background:#e4e8ec;color:#fff;font-size:12px;margin-right:5px;vertical-align:1px}
  .steps li.active{color:#00a04f;font-weight:700;border-top-color:#00a04f}
  .steps li.active .n{background:#00a04f}
  .steps li.done{color:#41505f;border-top-color:#a9dcbf}
  .steps li.done .n{background:#a9dcbf}
  .steps li.done{cursor:pointer}
  .steps li{cursor:pointer}
  .steps li.active{cursor:default}
  /* ---- 步骤内容 ---- */
  /* 默认隐藏：JS 加载前也不许露出第 2、3 步的内容（否则会闪一下全部步骤） */
  .panel{display:none}
  .panel.active{display:block}
  .panel > p{margin:0 0 14px}
  .lead{font-size:16px}
  /* 第 3 步里的 3 个小步骤：换行 + 编号 */
  .steps-mini{margin:0 0 16px;padding-left:26px}
  .steps-mini li{margin:0 0 6px}
  .steps-mini li::marker{font-weight:700;color:#00a04f}
  figure{margin:16px 0}
  figure img{width:100%;max-width:520px;border-radius:8px;border:1px solid #e4e8ec;display:block}
  figure video{width:100%;border-radius:8px;border:1px solid #e4e8ec;display:block;background:#000}
  figcaption{font-size:13px;color:#77828e;margin-top:6px}
  .fwline{font-size:14px;color:#41505f;margin:0 0 10px}
  button.go{display:block;font-size:17px;padding:12px 24px;border:0;border-radius:8px;cursor:pointer;background:#00a04f;color:#fff}
  button.go:disabled{opacity:.5;cursor:not-allowed}
  .bar{height:14px;background:#eee;border-radius:7px;overflow:hidden;margin:14px 0 10px;max-width:460px}
  #bar{height:100%;width:0%;background:#00a04f;transition:width .15s}
  #st{font-size:14px;min-height:20px;white-space:pre-wrap;margin-bottom:8px}
  .notice{display:none;color:#a11;font-size:13px;margin-top:10px}
  /* ---- 底部导航：左「上一步」右「下一步」 ---- */
  .nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid #eef1f4}
  .nav button{font-size:16px;padding:11px 22px;border-radius:8px;border:0;cursor:pointer}
  .nav button.next{background:#00a04f;color:#fff}
  .nav button.back{background:#eef1f4;color:#33414f}
  .nav button.ghost{visibility:hidden}
  .nav button:disabled{background:#e2e7ec;color:#9aa5b1;cursor:not-allowed}
  /* ---- 共用输出窗口（烧录信息 + 串口日志）---- */
  .console{margin:16px 0 4px}
  .console .tools{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .console .tools button{font-size:13px;padding:6px 12px;border:1px solid #ccd3da;background:#fff;border-radius:6px;cursor:pointer}
  .console .tools button:hover{background:#f4f7f9}
  /* 串口连接状态（右上角）：未连接 = 绿色「连接」，已连接 = 红色「断开」 */
  #link{margin-left:auto;font-weight:600;color:#00a04f;border-color:#00a04f}
  #link:hover{background:#eaf7ef}
  #link.linked{color:#d33;border-color:#d33}
  #link.linked:hover{background:#fdecec}
  #link:disabled{opacity:.5;cursor:not-allowed}
  #out{background:#111;color:#d8e0d8;font:13px/1.55 Consolas,"Courier New",monospace;height:300px;overflow:auto;padding:10px 12px;border-radius:8px;white-space:pre-wrap;word-break:break-all;margin:0}
  /* ---- FAQ：卡片下面，跟随步骤 ---- */
  .faq{display:none;background:#fff;border:1px solid #e4e8ec;border-radius:14px;box-shadow:0 2px 12px rgba(16,32,48,.06);padding:18px 26px 8px;margin:18px 0 0}
  .faq.active{display:block}
  .faq h3{font-size:15px;margin:0 0 6px;color:#41505f}
  details{border-top:1px solid #eceff2;padding:10px 0}
  details summary{cursor:pointer;font-weight:600;font-size:14px}
  details p{color:#555;font-size:14px;margin:8px 0 0;line-height:1.7}
  details p b{color:#333}
  /* ---- 更新日志（卡片内最后一块，数据来自 firmwares.json 的 note_en/note_zh）---- */
  .changelog{margin:18px 0 0;border-top:1px solid #e9edf1;padding-top:12px}
  .changelog h3{font-size:15px;margin:0 0 8px;color:#41505f}
  .changelog .ver{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font-size:14px;margin:0 0 4px}
  .changelog .ver .tag{font-weight:700;color:#00a04f}
  .changelog .ver .date{color:#8b959f;font-size:12px}
  .changelog .ver .now{background:#e7f6ec;color:#007a3d;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700}
  .changelog .ver .old{background:#f1f3f5;color:#6b7683;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700}
  .changelog ul{margin:0 0 10px;padding-left:20px;color:#4a5560;font-size:13px}
  .changelog ul li{margin:0 0 3px}
  .changelog .more{font-size:13px}
  .changelog .more a{color:#00a04f;text-decoration:none;font-weight:600}
  .changelog .more a:hover{text-decoration:underline}
  .lang-toggle{position:fixed;top:16px;right:16px;z-index:999;background:#fff;border:1px solid #e2e8f0;border-radius:6px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:#1e293b}
  .lang-toggle:hover{background:#00a04f;color:#fff;border-color:#00a04f}
</style>
<noscript><style>
  /* 没有 JS 时 showStep() 不会跑，全部显示（脚本失效也别让用户看着空白） */
  .panel{display:block}
  .faq{display:block}
</style></noscript>
</head>
<body>
<button class="lang-toggle" id="langToggle" onclick="toggleLang()">中文</button>

<div class="wrap">
<div class="card">
  <h2 data-en="GalaxyRVR Firmware Update" data-zh="GalaxyRVR 固件烧录"></h2>

  <ul class="steps" id="steps">
    <li id="si1" class="active"><span class="n">1</span><span data-en="Connect" data-zh="接线"></span></li>
    <li id="si2"><span class="n">2</span><span data-en="Flash" data-zh="烧录"></span></li>
    <li id="si3"><span class="n">3</span><span data-en="Debug" data-zh="调试"></span></li>
  </ul>

  <!-- ============ 第 1 步 ============ -->
  <section class="panel active" id="p1">
    <p class="lead" data-en="Turn on the rover, connect the main board to your computer with a <b>USB A to B</b> cable (not the Type-C one), then set the mode switch to the <b>Upload</b> position."
       data-zh="打开火星车的电源开关，用 <b>USB A 转 B</b> 线（不是 Type-C 那根）把主板连到电脑，然后把模式开关拨到 <b>Upload</b> 位置。"></p>
    <figure>
      <img src="img/camera_upload.jpg" alt="Upload switch">
      <figcaption data-en="Set the switch to UPLOAD" data-zh="把开关拨到 UPLOAD"></figcaption>
    </figure>
    <div class="nav">
      <button class="nav-btn back ghost" data-go="1" data-en="Back" data-zh="上一步"></button>
      <button class="nav-btn next" data-go="2" data-en="Next" data-zh="下一步"></button>
    </div>
  </section>

  <!-- ============ 第 2 步 ============ -->
  <section class="panel" id="p2">
    <p class="lead" data-en="Click the button below and pick the port of your board in the dialog - it is listed as <b>Arduino UNO R3</b> on the official board, or <b>USB-SERIAL CH340</b> on CH340 based boards. Do not unplug the cable while it is writing."
       data-zh="点下面的按钮，在弹窗里选主板对应的串口——官方板显示为 <b>Arduino UNO R3</b>，CH340 板显示为 <b>USB-SERIAL CH340</b>，二选一。写入过程中不要拔线。"></p>
    <p class="fwline" id="fwline"></p>
    <button class="go" id="go" data-en="Connect &amp; Flash" data-zh="连接并烧录"></button>
    <p class="notice" id="notice" data-en="This page needs Web Serial. Please open it in Chrome or Edge on a computer." data-zh="本页需要 Web Serial 支持，请在电脑上用 Chrome 或 Edge 打开。"></p>
    <div class="bar"><div id="bar"></div></div>
    <div id="st"></div>
    <div class="nav">
      <button class="nav-btn back" data-go="1" data-en="Back" data-zh="上一步"></button>
      <button class="nav-btn next" data-go="3" data-en="Next" data-zh="下一步"></button>
    </div>
  </section>

  <!-- ============ 第 3 步 ============ -->
  <section class="panel" id="p3">
    <ol class="lead steps-mini" data-en="<li>Turn the power switch on.</li><li>Switch the mode to <b>Run</b> and press the <b>Reset</b> button on the R3 board.</li><li>The bottom light strip will flash <b>green</b>, indicating a successful startup.</li>"
        data-zh="<li>打开电源开关。</li><li>把模式开关拨到 <b>Run</b>，再按一下 R3 板上的 <b>Reset</b> 键。</li><li>火星车底部灯带会闪<b>绿色</b>，说明启动成功。</li>"></ol>
    <figure>
      <!-- 视频分中英两版：src 由脚本按语言填，浏览器只会去下当前语言那个 -->
      <video controls muted playsinline preload="metadata"
             data-src-en="img/check_firmware.mp4" data-src-zh="img/check_firmware_zh.mp4"></video>
      <figcaption data-en="Check the firmware version" data-zh="检查固件版本"></figcaption>
    </figure>
    <div class="nav">
      <button class="nav-btn back" data-go="2" data-en="Back" data-zh="上一步"></button>
    </div>
  </section>

  <!-- 共用输出窗口：第 2、3 步都会挂到 .nav 前面 -->
  <div class="console" id="console">
    <div class="tools">
      <button id="dl" data-en="Download log" data-zh="下载日志"></button>
      <button id="clr" data-en="Clear" data-zh="清空"></button>
      <button id="link" data-en="Connect" data-zh="连接"></button>
    </div>
    <pre id="out"></pre>
  </div>

  <!-- 更新日志：内容由 firmwares.json 的 note_en/note_zh 渲染 -->
  <div class="changelog" id="changelog" style="display:none">
    <h3 data-en="What's new" data-zh="更新日志"></h3>
    <div id="changelogBody"></div>
    <p class="more"><a id="changelogMore" href="https://github.com/sunfounder/galaxy-rvr/releases" target="_blank" rel="noopener"
       data-en="Full changelog on GitHub" data-zh="完整更新日志见 GitHub"></a></p>
  </div>
</div>

<!-- ============ FAQ：卡片下面，跟随步骤 ============ -->
<div class="faq active" id="f2" data-step="2">
  <h3 data-en="Step 2 FAQ" data-zh="第 2 步常见问题"></h3>
  <details>
    <summary data-en="No port dialog appears" data-zh="没有弹出串口列表"></summary>
    <p data-en="Use <b>Chrome</b> or <b>Edge</b> on a computer, and open this page over <b>https</b>."
       data-zh="请在电脑上使用 <b>Chrome</b> 或 <b>Edge</b>，并确认本页是通过 <b>https</b> 打开的。"></p>
  </details>
  <details>
    <summary data-en="The board does not show up" data-zh="连接不上主板"></summary>
    <p data-en="Close other programs that are using the serial port (Arduino IDE, a serial monitor, another browser tab - including the Serial Monitor page of this site). Check the switch is still on <b>Upload</b>, try another USB cable or port, and make sure the USB serial driver is installed: Windows Device Manager should list <b>Arduino UNO R3</b> or <b>USB-SERIAL CH340</b>."
       data-zh="关掉其他正在占用串口的程序（Arduino IDE、串口监视器、另一个浏览器标签页——包括本站的串口监视器页面）。确认开关仍在 <b>Upload</b>，换一根 USB 线或换个 USB 口试试，并装好 USB 串口驱动：Windows 设备管理器里应能看到 <b>Arduino UNO R3</b> 或 <b>USB-SERIAL CH340</b>。"></p>
  </details>
  <details>
    <summary data-en="The flash failed - can I just try again?" data-zh="烧录失败了，能重试吗？"></summary>
    <p data-en="Yes. Unplug the USB cable, plug it back in, keep the switch on <b>Upload</b> and click the button again. Re-flashing does not damage the rover."
       data-zh="可以。拔下 USB 再插上，开关保持在 <b>Upload</b>，再点一次按钮即可；重复烧录不会损坏火星车。"></p>
  </details>
  <details>
    <summary data-en="No board shows up in the port list" data-zh="串口列表里找不到主板"></summary>
    <p data-en="The official board shows up as <b>Arduino UNO R3</b>; a CH340 board shows up as <b>USB-SERIAL CH340</b> - if neither is listed, install the CH340 USB serial driver and reload this page. If it still does not appear, try another USB cable (some cables are charge-only) and another USB port."
       data-zh="官方板显示为 <b>Arduino UNO R3</b>，CH340 板显示为 <b>USB-SERIAL CH340</b>——两个都没有的话，装一下 CH340 串口驱动再刷新本页。还是没有，换一根 USB 线（有些线只能充电）和另一个 USB 口试试。"></p>
  </details>
</div>

<div class="faq" id="f3" data-step="3">
  <h3 data-en="Step 3 FAQ (Debug)" data-zh="第 3 步常见问题（调试）"></h3>
  <details>
    <summary data-en="How do I check the firmware version?" data-zh="怎么核对固件版本？"></summary>
    <p data-en="The first line of the log is <b>GalaxyRVR version X.Y.Z</b>, followed by <b>Initialzing...</b> and <b>Okie!</b>. This page flashes <b>2.0.2</b>."
       data-zh="日志第一行就是 <b>GalaxyRVR version X.Y.Z</b>，接着是 <b>Initialzing...</b> 和 <b>Okie!</b>。本页烧录的是 <b>2.0.2</b>。"></p>
  </details>
  <details>
    <summary data-en="The light strip stays solid orange, or the camera version in the log is old" data-zh="火星车底部灯带常亮橙色，或日志里摄像头版本偏低"></summary>
    <p data-en="<b>ESP32 firmware version X.Y.Z</b> in the window above is the ESP32-CAM firmware; if it is older than <b>1.5.4</b>, the camera firmware needs updating. The same applies when the strip under the rover does <b>not</b> flash <b>green</b> about 10 s after startup: with older camera firmware (such as 1.4.2) the strip stays <b>solid orange</b>, which also means the camera is not running. See <a href='https://docs.sunfounder.com/projects/galaxy-rvr/en/latest/update_firmware.html#updating-the-esp32-cam-firmware' target='_blank' rel='noopener'>Updating the ESP32 CAM Firmware</a>."
       data-zh="上面窗口里的 <b>ESP32 firmware version X.Y.Z</b> 就是 ESP32-CAM 的固件版本；低于 <b>1.5.4</b> 就该更新。开机约 10 秒后火星车底部灯带<b>没有</b>闪<b>绿色</b>也是同一个问题：摄像头固件偏旧（如 <b>1.4.2</b>）时灯带会<b>常亮橙色</b>，说明摄像头没跑起来。详见 <a href='https://docs.sunfounder.com/projects/galaxy-rvr/zh-cn/latest/update_firmware.html#esp32-cam' target='_blank' rel='noopener'>更新 ESP32 CAM 固件</a>。"></p>
  </details>
  <details>
    <summary data-en="What is the Connect button for?" data-zh="右上角那个「连接」按钮是干什么的？"></summary>
    <p data-en="It opens the rover's serial port as a plain serial monitor at <b>115200</b> - no flashing needed. If the rover is already connected (the button is red and reads <b>Disconnect</b>), click it and confirm to release the port, so another program or the flashing step can use it."
       data-zh="它把火星车的串口直接当成串口工具打开（<b>115200</b>），不需要先烧录。如果显示为红色的<b>断开</b>，说明串口已经被本页占用，点一下并确认即可释放，让别的程序或烧录步骤使用。"></p>
  </details>
  <details>
    <summary data-en="The serial window stays empty" data-zh="串口窗口没有输出"></summary>
    <p data-en="Power-cycle the rover or press the <b>Reset</b> button; the port is opened at 115200, which is the only baud rate the rover uses."
       data-zh="给火星车重新上电，或按一下 <b>Reset</b> 键；本页固定用 115200，火星车只用这个波特率。"></p>
  </details>
</div>
</div>

<script>
// 视频按语言选：中英各一份，只填当前语言那个 src
function applyLangVideo() {
  var lang = window.LANG || getLang();
  document.querySelectorAll("video[data-src-zh]").forEach(function (v) {
    if (v.getAttribute("data-lang-video") === lang) return;
    v.setAttribute("data-lang-video", lang);
    v.setAttribute("src", v.getAttribute(lang === "zh" ? "data-src-zh" : "data-src-en"));
  });
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", applyLangVideo);
else applyLangVideo();
function toggleLang() {
  var url = new URL(window.location);
  url.searchParams.set("lang", getLang() === "zh" ? "en" : "zh");
  window.location.href = url.toString();
}
var LANG = getLang();   // 与 <head> 里那次判定同一个值
function T(en, zh) { return LANG === "zh" ? zh : en; }
function el(id){ return document.getElementById(id); }
</script>

<script type="module">
import { STK500 } from "../../vendor/webserial-flasher/stk500.js";
import { WebSerialTransport } from "../../vendor/webserial-flasher/transport/WebSerialTransport.js";

const panels = [el("p1"), el("p2"), el("p3")], faqs = Array.from(document.querySelectorAll(".faq")), consoleEl = el("console");
const go = el("go"), bar = el("bar"), st = el("st"), out = el("out"), notice = el("notice"), fwline = el("fwline");
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const BAUD = 115200; // the rover only ever talks at 115200, so it is fixed here

let fw = null, fwAll = [], BOARD = {};
let port = null;          // kept between the flash and the serial session
let reading = null;       // the live reader of the serial session
let monitoring = false;   // true while the serial session is running
let portBusy = false;     // true while a session is being opened/closed, or while flashing
let step = 1;

/* ---------- 步骤切换 ---------- */
function stepFromHash(){
  const m = (location.hash || "").match(/^#step([123])$/);
  return m ? +m[1] : 1;
}

function showStep(n){
  step = n;
  if (location.hash !== "#step" + n) history.replaceState(null, "", "#step" + n);
  panels.forEach((p, i) => p.classList.toggle("active", i === n - 1));
  faqs.forEach(f => f.classList.toggle("active", f.getAttribute("data-step") === String(n)));
  for (let i = 1; i <= 3; i++){
    const li = el("si" + i);
    li.classList.toggle("active", i === n);
    li.classList.toggle("done", i < n);
  }
  // 同一个输出窗口跟着步骤走：第 2、3 步都显示，放在底部按钮上面
  if (n >= 2){
    const panel = panels[n - 1];
    panel.insertBefore(consoleEl, panel.querySelector(".nav"));
    consoleEl.style.display = "";
  } else {
    document.querySelector(".card").appendChild(consoleEl);
    consoleEl.style.display = "none";
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
}
document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => showStep(+b.dataset.go)));
// 3 个步骤都可以直接点：只读调试的用户可以跳过烧录，直接进第 3 步连串口
[1, 2, 3].forEach(n => el("si" + n).addEventListener("click", () => { if (step !== n) showStep(n); }));
// 步骤写进地址栏 hash（#step1/#step2/#step3）：可直接分享「打开就是调试」的链接，浏览器前进/后退也能用
addEventListener("hashchange", () => { const n = stepFromHash(); if (n !== step) showStep(n); });

/* ---------- 输出窗口 ---------- */
function write(text){
  if (!text) return;
  out.appendChild(document.createTextNode(text));
  out.scrollTop = out.scrollHeight;
}
function line(text){ write(text + "\n"); }
function rule(text){ line(""); line("---------- " + text + " ----------"); }
function status(text){ st.textContent = text || ""; }

el("clr").addEventListener("click", () => { out.textContent = ""; });
el("dl").addEventListener("click", () => {
  const d = new Date(), p = (v) => String(v).padStart(2, "0");
  const stamp = d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  const blob = new Blob([out.textContent], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "galaxy-rvr-log-" + stamp + ".txt";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
});

/* ---------- 固件信息 ---------- */
async function loadFirmware(){
  const resp = await fetch("./firmwares.json", { cache: "no-store" });
  if (!resp.ok) throw new Error("HTTP " + resp.status);
  const cfg = await resp.json();
  BOARD = cfg.board || {};
  fwAll = cfg.firmwares || [];
  fw = fwAll[0];
  if (!fw) throw new Error("empty firmware list");
  fwline.textContent = T("Firmware in this page: ", "本页固件：") + fw.version + (fw.date ? " (" + fw.date + ")" : "");
  renderChangelog();
}

/* ---------- 更新日志：取 firmwares.json 里各版本的 note_en / note_zh ---------- */
function renderChangelog(){
  const list = Array.isArray(fwAll) ? fwAll : (fw ? [fw] : []);
  const box = el("changelog"), body = el("changelogBody");
  const rows = [];
  list.forEach((f, i) => {
    const note = (LANG === "zh" ? f.note_zh : f.note_en) || (LANG === "zh" ? "常规更新" : "Routine update");
    const pts = String(note).split("|").map(s => s.trim()).filter(Boolean);
    const badge = i === 0
      ? '<span class="now">' + T("current", "当前") + "</span>"
      : '<span class="old">' + T("earlier", "早期") + "</span>";
    rows.push('<div class="ver"><span class="tag">' + f.version + "</span>" +
      '<span class="date">' + (f.date || "") + "</span>" + badge + "</div>" +
      "<ul>" + pts.map(p => "<li>" + p + "</li>").join("") + "</ul>");
  });
  if (!rows.length){ box.style.display = "none"; return; }
  body.innerHTML = rows.join("");
  box.style.display = "";
}

function hexToBytes(hex){
  const s = String(hex || "").replace(/[^0-9a-fA-F]/g, "");
  const b = new Uint8Array(s.length / 2);
  for (let i = 0; i < b.length; i++) b[i] = parseInt(s.substr(i * 2, 2), 16);
  return b;
}

/* ---------- 串口会话 ---------- */
// 右上角连接状态：已连接 = 红色「断开」，未连接 = 绿色「连接」
function isLinked(){ return monitoring && !!reading; }
function updateLink(){
  const b = el("link");
  const on = isLinked();
  b.classList.toggle("linked", on);
  b.textContent = on ? T("Disconnect", "断开") : T("Connect", "连接");
  b.title = on
    ? T("Serial port open - click to disconnect", "串口已连接——点击断开")
    : T("Use the serial port without flashing", "不烧录也能当串口工具用");
}

// 打开串口并在后台读日志：readLoop 不 await，调用方（烧录流程）才能马上收尾
async function startMonitor(){
  if (!port) return;
  const keepReading = port;
  portBusy = true;
  try {
    await port.open({ baudRate: BAUD });
    monitoring = true;
    reading = port.readable.getReader();
    rule(T("serial open at 115200", "串口已打开（115200）"));
  } finally {
    portBusy = false;
    updateLink();
  }
  readLoop(keepReading).catch(() => {});
}

async function readLoop(keepReading){
  const decoder = new TextDecoder("utf-8", { fatal: false });
  try {
    for (;;){
      const r = reading;
      if (!r) break;
      const res = await r.read();
      if (res.done || !monitoring) break;
      if (res.value && res.value.length) write(decoder.decode(res.value, { stream: true }));
    }
  } catch (e) { /* port closed or unplugged */ }
  finally {
    const r = reading;
    reading = null;
    if (r) { try { r.releaseLock(); } catch (e) {} }
    monitoring = false;
    // 只有当前这条循环还属于这个端口时才更新按钮，避免打断新会话
    if (keepReading === port) updateLink();
  }
}

// 读循环停了但串口还没关干净时，烧录前先把它关掉（monitoring 为 true 时读循环正拿着端口，不能抢）
async function closeIdlePort(){
  if (monitoring || !port) return;
  let r = null;
  try { r = reading; reading = null; } catch (e) { r = null; }
  try { if (r) await r.cancel(); } catch (e) {}
  await sleep(60);
  try { if (port.readable) await port.close(); } catch (e) {}
}

async function stopMonitor(){
  monitoring = false;
  reading = null;                  // 让读循环自己退出，连接状态保持红色直到真正关闭
  portBusy = true;
  const r = reading;
  reading = null;
  if (r){ try { await r.cancel(); } catch (e) {} }
  await sleep(60);
  try { if (port) await port.close(); } catch (e) {}
  portBusy = false;
  updateLink();
}

/* ---------- 右上角「连接 / 断开」：把串口当串口工具用 ---------- */
el("link").addEventListener("click", async () => {
  const b = el("link");
  if (portBusy) return;
  if (isLinked()){
    if (!confirm(T("Disconnect the rover's serial port?", "确定断开火星车的串口吗？"))) return;
    b.disabled = true;
    try {
      await stopMonitor();
      rule(T("serial closed", "串口已断开"));
    } catch (e) {
      line(String(e && e.message ? e.message : e));
    } finally {
      b.disabled = false;
      updateLink();
    }
    return;
  }
  b.disabled = true;
  try {
    if (!navigator.serial) throw new Error(T("This page needs Web Serial. Please open it in Chrome or Edge on a computer.",
      "本页需要 Web Serial 支持，请在电脑上用 Chrome 或 Edge 打开。"));
    if (monitoring) await stopMonitor();   // 上一次读循环还没收干净
    status(T("Choose the serial port of your board in the dialog…", "请在弹窗里选择主板对应的串口…"));
    if (!port) port = await navigator.serial.requestPort();
    await startMonitor();          // 打开后拉 DTR，主板会复位一下再开始输出日志
    status(T("Serial port open - the window below shows the rover log.", "串口已连接——下面的窗口显示火星车日志。"));
  } catch (e) {
    line(String(e && e.message ? e.message : e));
    status(T("Failed: ", "失败：") + (e && e.message ? e.message : e));
  } finally {
    portBusy = false;
    b.disabled = false;
    updateLink();
  }
});

/* ---------- 烧录 ---------- */
go.addEventListener("click", async () => {
  go.disabled = true;
  portBusy = true;
  el("link").disabled = true;
  bar.style.width = "0%";
  status("");
  out.textContent = "";
  let transport = null;
  try {
    if (monitoring) throw new Error(T("The serial port is connected - click Disconnect in the top right first, then flash.",
      "串口已连接——请先点右上角「断开」，再烧录。"));
    if (!fw) throw new Error(T("Firmware list not loaded yet.", "固件列表还没加载好。"));
    if (!navigator.serial) throw new Error(T("This page needs Web Serial. Please open it in Chrome or Edge on a computer.",
      "本页需要 Web Serial 支持，请在电脑上用 Chrome 或 Edge 打开。"));

    await closeIdlePort();   // 上一次调试留下的串口没收干净就先关掉

    status(T("Reading firmware file…", "读取固件文件…"));
    line(T("Reading ", "读取 ") + fw.file);
    const resp = await fetch(fw.file, { cache: "no-store" });
    if (!resp.ok) throw new Error("HTTP " + resp.status + " " + fw.file);
    const hexText = await resp.text();
    if (hexText.indexOf(":") !== 0) throw new Error("bad firmware file: " + fw.file);

    const board = {
      name: BOARD.name || "Arduino UNO",
      baudRate: BAUD,
      signature: hexToBytes(BOARD.signature || "1e950f"),
      pageSize: BOARD.pageSize || 128,
      timeout: 600,
      flashSize: BOARD.flashSize || 32256,
      resetMethod: "none",
      resetDelayMs: 0,
    };

    status(T("Choose the serial port of your board in the dialog…", "请在弹窗里选择主板对应的串口…"));
    if (!port) port = await navigator.serial.requestPort();
    transport = new WebSerialTransport(port);
    await transport.open(BAUD);

    // Arduino auto-reset: DTR low then high pulses RESET through the 100nF cap
    status(T("Resetting the board…", "复位主板…"));
    line(T("Resetting the board…", "复位主板…"));
    try {
      await port.setSignals({ dataTerminalReady: false, requestToSend: false });
      await sleep(120);
      await port.setSignals({ dataTerminalReady: true, requestToSend: true });
    } catch (e) {}
    await sleep(BOARD.resetDelayMs || 500);

    const stk = new STK500(transport, board, {
      logger: () => {},
      retry: { syncAttempts: 10, retryDelayMs: 250 },
    });

    status(T("Connecting to the board…", "连接主板…"));
    line(T("Connecting to the board…", "连接主板…"));
    await stk.sync(10);
    await stk.sync(3);
    await stk.verifySignature();
    await stk.setOptions();
    await stk.enterProgrammingMode();
    bar.style.width = "18%";

    await stk.upload(hexText, (pct) => {
      const p = Math.round(pct);
      bar.style.width = (18 + p * 0.57) + "%";
      status(T("Writing firmware… ", "写入固件… ") + p + "%");
    });
    line(T("Firmware written.", "固件已写入。"));

    await stk.verify(hexText, (pct) => {
      const p = Math.round(pct);
      bar.style.width = (75 + p * 0.2) + "%";
      status(T("Verifying… ", "回读校验… ") + p + "%");
    });
    line(T("Verified - flash matches the file.", "回读校验通过，与固件文件一致。"));

    status(T("Finishing up…", "收尾…"));
    await stk.exitProgrammingMode();
    await transport.close();
    transport = null;

    bar.style.width = "100%";
    status(T("Done. Opening the serial port…", "烧录完成，正在打开串口…"));

    // 交给串口会话：主板刚复位，启动日志（含版本号）会落在同一个窗口里
    await sleep(300);
    await startMonitor();          // startMonitor 内部自己管 portBusy
    status(T("Done - firmware flashed, serial port open.", "完成——固件已烧录，串口已打开。"));
    showStep(3);
  } catch (e) {
    status(T("Failed: ", "失败：") + (e && e.message ? e.message : e));
    line(String(e && e.message ? e.message : e));
  } finally {
    if (transport) { try { await transport.close(); } catch (e) {} }
    go.disabled = false;
    el("link").disabled = false;   // 烧录过程中锁住「连接/断开」
    portBusy = false;
    updateLink();
  }
});

// 带 hash 打开（如 ?lang=zh#step3）直接进对应步骤：调试用户不用先点两下
showStep(stepFromHash());
updateLink();
loadFirmware().catch(e => { status(T("Failed: ", "失败：") + e.message); });
</script>

  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  document.title = T("GalaxyRVR Firmware Update", "GalaxyRVR 固件烧录");
  document.querySelectorAll("[data-en][data-zh]").forEach(function (el) {
    el.innerHTML = LANG === "zh" ? el.getAttribute("data-zh") : el.getAttribute("data-en");
  });

  if (!navigator.serial) {
    document.getElementById("go").disabled = true;
    document.getElementById("notice").style.display = "block";
  }
})();
</script>
