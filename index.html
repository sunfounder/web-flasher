<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>固件烧录工具集 · SunFounder</title>
<style>
  body{font-family:system-ui,"Microsoft YaHei",sans-serif;max-width:720px;margin:40px auto;padding:0 16px;color:#222}
  h2{margin-bottom:6px}
  .ver{color:#666;font-size:13px;margin-top:0}
  .list{margin-top:22px;display:grid;gap:12px}
  a.tool{display:block;text-decoration:none;color:inherit;border:1px solid #e3e6ea;border-radius:10px;padding:14px 16px;transition:.15s;background:#fff}
  a.tool:hover{border-color:#00a04f;box-shadow:0 2px 10px rgba(0,160,79,.12)}
  .tname{font-size:17px;font-weight:bold;display:flex;align-items:center;gap:8px}
  .tag{font-size:12px;font-weight:normal;color:#fff;background:#00a04f;border-radius:10px;padding:1px 8px}
  .meta{font-size:13px;color:#555;margin-top:6px;line-height:1.7;white-space:pre-line}
  .go{color:#00a04f;font-size:13px;margin-top:8px;font-weight:bold}
  .empty{color:#888;font-size:14px;margin-top:20px}
</style>
</head>
<body>
<h2>固件烧录工具集</h2>
<p class="ver">Web Flasher · 浏览器直连设备烧录（Web Serial），无需安装驱动与软件；点进对应工具即可烧录</p>

<div class="list" id="list"></div>
<p class="empty" id="empty" style="display:none">暂无工具</p>

<script type="module">
const listEl = document.getElementById("list");
const emptyEl = document.getElementById("empty");
fetch("./tools.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error("工具清单读取失败 HTTP " + r.status); return r.json(); })
  .then(data => {
    const tools = data.tools || [];
    if (!tools.length) { emptyEl.style.display = "block"; return; }
    for (const t of tools) {
      const a = document.createElement("a");
      a.className = "tool";
      a.href = t.path;
      const name = document.createElement("div");
      name.className = "tname";
      name.textContent = t.name;
      if (t.version) { const s = document.createElement("span"); s.className = "tag"; s.textContent = "v" + t.version; name.appendChild(s); }
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = (t.target ? "目标设备：" + t.target + "\n" : "") + (t.desc || "");
      const go = document.createElement("div");
      go.className = "go";
      go.textContent = "进入烧录页面 →";
      a.appendChild(name); a.appendChild(meta); a.appendChild(go);
      listEl.appendChild(a);
    }
  })
  .catch(e => { emptyEl.style.display = "block"; emptyEl.textContent = "❌ " + e.message; });
</script>
</body>
</html>
