<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SunFounder Firmware Flasher</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
  body{font-family:system-ui,"Microsoft YaHei",sans-serif;max-width:720px;margin:40px auto;padding:0 16px;color:#222;line-height:1.5}
  h2{margin-bottom:6px}
  .ver{color:#666;font-size:14px;margin-top:0}
  .list{margin-top:22px;display:grid;gap:12px}
  a.tool{display:block;text-decoration:none;color:inherit;border:1px solid #e3e6ea;border-radius:10px;padding:14px 16px;transition:.15s;background:#fff}
  a.tool:hover{border-color:#00a04f;box-shadow:0 2px 10px rgba(0,160,79,.12)}
  .tname{font-size:17px;font-weight:bold;display:flex;align-items:center;gap:8px}
  .tag{font-size:12px;font-weight:normal;color:#fff;background:#00a04f;border-radius:10px;padding:1px 8px}
  .meta{font-size:13px;color:#555;margin-top:6px;line-height:1.7;white-space:pre-line}
  .go{color:#00a04f;font-size:13px;margin-top:8px;font-weight:bold}
  .empty{color:#888;font-size:14px;margin-top:20px}
  .lang-toggle{position:fixed;top:16px;right:16px;z-index:999;background:#fff;border:1px solid #e2e8f0;border-radius:6px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:#1e293b}
  .lang-toggle:hover{background:#00a04f;color:#fff;border-color:#00a04f}
</style>
</head>
<body>
<button class="lang-toggle" id="langToggle" onclick="toggleLang()">中文</button>

<h2 data-en="Firmware Flasher" data-zh="固件烧录工具集"></h2>
<p class="ver" data-en="Flash firmware straight from your browser. Pick a tool below to get started."
   data-zh="在浏览器里直接烧录固件。点下面的工具进入对应的烧录页面。"></p>

<div class="list" id="list"></div>
<p class="empty" id="empty" style="display:none"></p>

<script>
function getLang() {
  var params = new URLSearchParams(window.location.search);
  var urlLang = params.get("lang");
  if (urlLang === "zh" || urlLang === "en") return urlLang;
  var userLang = navigator.language || navigator.userLanguage || "en";
  return userLang.toLowerCase().startsWith("zh") ? "zh" : "en";
}
function toggleLang() {
  var url = new URL(window.location);
  url.searchParams.set("lang", getLang() === "zh" ? "en" : "zh");
  window.location.href = url.toString();
}
var LANG = getLang();
function T(en, zh) { return LANG === "zh" ? zh : en; }

document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
document.title = T("SunFounder Firmware Flasher", "SunFounder 固件烧录工具集");
document.querySelectorAll("[data-en][data-zh]").forEach(function (el) {
  el.innerHTML = LANG === "zh" ? el.getAttribute("data-zh") : el.getAttribute("data-en");
});
document.getElementById("langToggle").textContent = LANG === "zh" ? "EN" : "中文";

const listEl = document.getElementById("list");
const emptyEl = document.getElementById("empty");
emptyEl.textContent = T("No tools yet", "暂无工具");

fetch("./tools.json", { cache: "no-store" })
  .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(function (data) {
    const tools = data.tools || [];
    if (!tools.length) { emptyEl.style.display = "block"; return; }
    for (const t of tools) {
      const a = document.createElement("a");
      a.className = "tool";
      a.href = t.path + (t.path.indexOf("?") === -1 ? "?" : "&") + "lang=" + LANG;
      const name = document.createElement("div");
      name.className = "tname";
      name.textContent = T(t.name_en || t.name, t.name);
      if (t.version) { const s = document.createElement("span"); s.className = "tag"; s.textContent = t.version; name.appendChild(s); }
      const meta = document.createElement("div");
      meta.className = "meta";
      const target = T(t.target_en || t.target, t.target);
      const desc = T(t.desc_en || t.desc, t.desc);
      meta.textContent = (target ? T("Target: ", "目标设备：") + target + "\n" : "") + (desc || "");
      const go = document.createElement("div");
      go.className = "go";
      go.textContent = T("Open flashing page →", "进入烧录页面 →");
      a.appendChild(name); a.appendChild(meta); a.appendChild(go);
      listEl.appendChild(a);
    }
  })
  .catch(function (e) { emptyEl.style.display = "block"; emptyEl.textContent = "❌ " + e.message; });
</script>
</body>
</html>
